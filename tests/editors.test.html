<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terminal-cards editors test running</title>
    <script>
      customElements.define('ha-icon', class extends HTMLElement {});
      customElements.define(
        'ha-form',
        class extends HTMLElement {
          set hass(value) { this._hass = value; }
          get hass() { return this._hass; }
          set data(value) { this._data = value; }
          get data() { return this._data; }
          set schema(value) { this._schema = value; }
          get schema() { return this._schema; }
          set computeLabel(value) { this._computeLabel = value; }
          get computeLabel() { return this._computeLabel; }
          set computeHelper(value) { this._computeHelper = value; }
          get computeHelper() { return this._computeHelper; }
        }
      );
      customElements.define('ha-tab-group', class extends HTMLElement {});
      customElements.define(
        'ha-tab-group-tab',
        class extends HTMLElement {
          set panel(value) { this._panel = value; }
          get panel() { return this._panel; }
          set active(value) { this._active = value; }
          get active() { return this._active; }
        }
      );
      customElements.define(
        'ha-icon-button',
        class extends HTMLElement {
          set label(value) { this._label = value; }
          get label() { return this._label; }
          set disabled(value) { this._disabled = Boolean(value); }
          get disabled() { return this._disabled; }
        }
      );
      customElements.define('ha-alert', class extends HTMLElement {});
      customElements.define(
        'hui-card-element-editor',
        class extends HTMLElement {
          set value(value) { this._value = value; }
          get value() { return this._value; }
          toggleMode() {
            this.dispatchEvent(
              new CustomEvent('GUImode-changed', {
                bubbles: true,
                detail: { guiMode: false, guiModeAvailable: true },
              })
            );
          }
        }
      );
      customElements.define('hui-card-picker', class extends HTMLElement {});
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <pre id="result">WAITING</pre>
    <script type="module">
      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function run() {
        await customElements.whenDefined('terminal-card-wrapper-editor');
        await customElements.whenDefined('terminal-title-card');
        await customElements.whenDefined('terminal-light-card');
        await customElements.whenDefined('terminal-switch-card');
        await customElements.whenDefined('terminal-sensor-card');
        await customElements.whenDefined('terminal-shutter-card');
        await customElements.whenDefined('terminal-navigation-card');

        const hass = {
          states: {
            'light.desk': { state: 'on', attributes: {} },
            'sensor.temp': { state: '21', attributes: {} },
          },
        };
        const lovelace = { config: { views: [] } };
        const editor = document.createElement('terminal-card-wrapper-editor');
        editor.hass = hass;
        editor.lovelace = lovelace;
        editor.setConfig({
          title: 'lights',
          columns: 2,
          entity: 'sensor.temp',
          state_template: '{{ states(config.entity) }} °C',
          state_position: 'bottom-right',
          cards: [
            { type: 'tile', entity: 'light.desk' },
            { type: 'markdown', content: 'hello' },
          ],
        });
        document.body.append(editor);

        let latest = null;
        editor.addEventListener('config-changed', (event) => {
          latest = event.detail.config;
        });

        const wrapperForm = editor.shadowRoot.querySelector('ha-form');
        assert(wrapperForm, 'native ha-form is missing');
        assert(wrapperForm.hass === hass, 'ha-form context missing');
        assert(
          wrapperForm.schema[0].schema.every((field) => field.selector),
          'wrapper fields do not use HA selectors'
        );
        assert(wrapperForm.computeLabel({ name: 'title' }) === 'Border title', 'HA form label callback missing');
        assert(wrapperForm.data.entity === 'sensor.temp', 'wrapper state entity was not loaded into the editor');
        assert(wrapperForm.data.state_position === 'bottom-right', 'wrapper state position was not loaded into the editor');
        wrapperForm.dispatchEvent(
          new CustomEvent('value-changed', {
            bubbles: true,
            detail: { value: { title: 'new title', columns: 2 } },
          })
        );
        assert(latest.title === 'new title', 'wrapper title was not updated');
        wrapperForm.dispatchEvent(
          new CustomEvent('value-changed', {
            bubbles: true,
            detail: { value: { title: 'new title' } },
          })
        );
        assert(latest.columns === undefined, 'vertical layout was not selected');
        wrapperForm.dispatchEvent(
          new CustomEvent('value-changed', {
            bubbles: true,
            detail: {
              value: {
                title: 'new title',
                accent_color: 'green',
                title_position: 'right',
                entity: 'sensor.temp',
                state_template: '{{ states(config.entity) }} °C',
                state_position: 'bottom-left',
              },
            },
          })
        );
        assert(latest.accent_color === 'green', 'wrapper HA theme color was not updated');
        assert(latest.title_position === 'right', 'wrapper title position was not updated');
        assert(latest.entity === 'sensor.temp', 'wrapper state entity was not updated');
        assert(latest.state_template.includes('states'), 'wrapper state template was not updated');
        assert(latest.state_position === 'bottom-left', 'wrapper state position was not updated');
        assert(editor.shadowRoot.querySelector('ha-tab-group'), 'native HA tab group missing');
        assert(editor.shadowRoot.querySelector('ha-icon-button'), 'native HA icon button missing');

        const childEditor = editor.shadowRoot.querySelector('hui-card-element-editor');
        assert(childEditor.hass === hass && childEditor.lovelace === lovelace, 'editor context missing');
        childEditor.dispatchEvent(
          new CustomEvent('config-changed', {
            bubbles: true,
            detail: { config: { type: 'tile', entity: 'light.desk', name: 'updated' } },
          })
        );
        assert(latest.cards[0].name === 'updated', 'child card visual edit was not saved');

        editor.shadowRoot.querySelector('[data-action="add"]').click();
        const picker = editor.shadowRoot.querySelector('hui-card-picker');
        assert(picker && picker.hass === hass && picker.lovelace === lovelace, 'native card picker missing');
        picker.dispatchEvent(
          new CustomEvent('config-changed', {
            bubbles: true,
            detail: { config: { type: 'button', entity: 'light.desk' } },
          })
        );
        assert(latest.cards.length === 3, 'picked child card was not added');

        editor.shadowRoot.querySelector('[data-action="prev"]').click();
        assert(latest.cards[1].type === 'button', 'child card was not reordered');
        editor.shadowRoot.querySelector('[data-action="delete"]').click();
        assert(latest.cards.length === 2, 'child card was not removed');

        const wrapperClass = customElements.get('terminal-card-wrapper');
        assert(wrapperClass.getConfigElement().localName === 'terminal-card-wrapper-editor', 'wrapper editor hook missing');
        assert(Array.isArray(wrapperClass.getStubConfig().cards), 'wrapper stub cards missing');

        const titleClass = customElements.get('terminal-title-card');
        const titleForm = titleClass.getConfigForm();
        const titleFields = titleForm.schema.flatMap((item) => item.schema || [item]);
        assert(titleFields.find((field) => field.name === 'title').selector.text, 'title card text selector missing');
        assert(titleFields.find((field) => field.name === 'subtitle').selector.template, 'title card subtitle selector missing');
        assert(titleFields.find((field) => field.name === 'font_size').selector.number, 'title card size selector missing');
        const titleAccent = titleFields.find((field) => field.name === 'accent_color');
        assert(titleAccent.selector.ui_color?.default_color === 'accent', 'title card does not use the HA theme color selector');
        assert(titleFields.some((field) => field.name === 'title_position'), 'title card position selector missing');

        const lightClass = customElements.get('terminal-light-card');
        const form = lightClass.getConfigForm();
        const fields = form.schema.flatMap((item) => item.schema || [item]);
        assert(fields.some((field) => field.name === 'entity'), 'light entity selector missing');
        assert(fields.some((field) => field.name === 'icon'), 'light icon selector missing');
        assert(fields.some((field) => field.name === 'tap_action'), 'light tap action missing');
        assert(fields.some((field) => field.name === 'show_hue'), 'light hue option missing');
        assert(fields.some((field) => field.name === 'show_color_temp'), 'light temperature option missing');
        assert(fields.some((field) => field.name === 'show_controls'), 'light controls button option missing');
        const lightAccent = fields.find((field) => field.name === 'accent_color');
        assert(lightAccent.selector.ui_color?.default_color === 'accent', 'light card does not use the HA theme color selector');
        assert(fields.some((field) => field.name === 'more_icon'), 'light controls icon option missing');
        assert(fields.find((field) => field.name === 'popup_title').selector.text, 'light popup title selector missing');
        assert(form.schema.filter((field) => field.type === 'expandable').length >= 3, 'native expandable groups missing');
        assert(!fields.some((field) => field.name === 'title'), 'light editor contains forbidden title');
        const entityField = fields.find((field) => field.name === 'entity');
        assert(entityField.selector.entity.filter.domain === 'light', 'light selector accepts other domains');

        const switchForm = customElements.get('terminal-switch-card').getConfigForm();
        const switchFields = switchForm.schema.flatMap((item) => item.schema || [item]);
        assert(
          switchFields.find((field) => field.name === 'entity').selector.entity.filter.domain === 'switch',
          'switch selector accepts other domains'
        );
        assert(switchFields.find((field) => field.name === 'tap_action').selector.ui_action, 'switch native actions missing');
        assert(switchFields.find((field) => field.name === 'accent_color').selector.ui_color, 'switch HA color selector missing');

        const sensorForm = customElements.get('terminal-sensor-card').getConfigForm();
        const sensorFields = sensorForm.schema.flatMap((item) => item.schema || [item]);
        const sensorDomains = sensorFields.find((field) => field.name === 'entity').selector.entity.filter.domain;
        assert(sensorDomains.includes('sensor') && sensorDomains.includes('binary_sensor'), 'sensor selector domains missing');
        assert(sensorFields.find((field) => field.name === 'tap_action').selector.ui_action, 'sensor native actions missing');
        assert(sensorFields.find((field) => field.name === 'accent_color').selector.ui_color, 'sensor HA color selector missing');

        const shutterForm = customElements.get('terminal-shutter-card').getConfigForm();
        const shutterFields = shutterForm.schema.flatMap((item) => item.schema || [item]);
        const coverEntity = shutterFields.find((field) => field.name === 'entity');
        assert(coverEntity.selector.entity.filter.domain === 'cover', 'shutter selector accepts other domains');
        assert(shutterFields.some((field) => field.name === 'show_tilt'), 'shutter tilt option missing');
        const shutterAccent = shutterFields.find((field) => field.name === 'accent_color');
        assert(shutterAccent.selector.ui_color?.default_color === 'accent', 'shutter card does not use the HA theme color selector');
        assert(shutterFields.some((field) => field.name === 'more_icon'), 'shutter controls icon missing');
        assert(shutterFields.find((field) => field.name === 'popup_title').selector.text, 'shutter popup title selector missing');
        assert(shutterFields.some((field) => field.name === 'hold_action'), 'shutter hold action missing');

        const navigationForm = customElements.get('terminal-navigation-card').getConfigForm();
        const navigationFields = navigationForm.schema.flatMap((item) => item.schema || [item]);
        assert(
          navigationFields.find((field) => field.name === 'navigation_path').selector.navigation,
          'native navigation selector missing'
        );
        assert(navigationFields.some((field) => field.name === 'variant'), 'navigation variant missing');
        const navigationAccent = navigationFields.find((field) => field.name === 'accent_color');
        assert(navigationAccent.selector.ui_color?.default_color === 'accent', 'navigation card does not use the HA theme color selector');
        assert(navigationFields.some((field) => field.name === 'title_position'), 'navigation title position missing');
        assert(navigationFields.some((field) => field.name === 'more_icon'), 'navigation icon option missing');
        assert(
          navigationFields.find((field) => field.name === 'entity').selector.entity,
          'navigation state entity selector missing'
        );
        assert(
          navigationFields.find((field) => field.name === 'state_template').selector.template,
          'navigation state template selector missing'
        );
        const navigationIconAction = navigationFields.find((field) => field.name === 'icon_tap_action');
        assert(navigationIconAction.selector.ui_action, 'navigation main icon native action missing');
        assert(
          navigationIconAction.selector.ui_action.actions.includes('perform-action'),
          'navigation main icon does not offer native HA services'
        );
        const wrapperStateFields = wrapperForm.schema[1].schema;
        const wrapperAppearanceFields = wrapperForm.schema[2].schema;
        assert(wrapperStateFields.find((field) => field.name === 'entity').selector.entity, 'wrapper state entity selector missing');
        assert(wrapperStateFields.find((field) => field.name === 'state_template').selector.template, 'wrapper state template selector missing');
        const wrapperPosition = wrapperStateFields.find((field) => field.name === 'state_position');
        assert(wrapperPosition.selector.select.options.length === 4, 'wrapper does not expose all four state corners');
        const wrapperAccent = wrapperAppearanceFields.find((field) => field.name === 'accent_color');
        assert(wrapperAccent.selector.ui_color?.default_color === 'accent', 'wrapper does not use the HA theme color selector');
        assert(wrapperAppearanceFields.some((field) => field.name === 'title_position'), 'wrapper title position missing');

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal-cards editors';
        document.querySelector('#result').textContent = [
          'PASS: wrapper fields use native ha-form controls',
          'PASS: native HA tabs, icon buttons, card picker and child editor',
          'PASS: child cards add, update, move and remove',
          'PASS: title card exposes native title, Markdown/template subtitle, size and appearance controls',
          'PASS: light, switch and sensor forms use native entity/action controls',
          'PASS: navigation main icon exposes native HA services',
          'PASS: all cards use the native HA theme color selector instead of RGB pickers',
          'PASS: wrapper state, shutter and navigation forms use native HA selectors',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal-cards editors';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
