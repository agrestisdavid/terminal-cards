<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terminal-light-card test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --error-color: #f38ba8;
      }
      body { background: #11111b; color: #cdd6f4; padding: 24px; }
      terminal-light-card { display: block; width: 420px; margin-bottom: 16px; }
    </style>
    <script>
      customElements.define('ha-icon', class extends HTMLElement {});
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <main id="cards"></main>
    <pre id="result">WAITING</pre>
    <script type="module">
      const calls = [];
      const hass = {
        states: {
          'light.desk': {
            entity_id: 'light.desk',
            state: 'on',
            attributes: {
              friendly_name: 'Desk light',
              brightness: 128,
              supported_color_modes: ['brightness'],
            },
          },
          'light.simple': {
            entity_id: 'light.simple',
            state: 'off',
            attributes: {
              friendly_name: 'Simple light',
              supported_color_modes: ['onoff'],
            },
          },
          'light.offline': {
            entity_id: 'light.offline',
            state: 'unavailable',
            attributes: { friendly_name: 'Offline light' },
          },
        },
        formatEntityState: (entity) => entity.state.toUpperCase(),
        callService: (...args) => calls.push(args),
      };

      function create(config) {
        const card = document.createElement('terminal-light-card');
        card.setConfig(config);
        card.hass = hass;
        document.querySelector('#cards').append(card);
        return card;
      }

      const light = create({
        entity: 'light.desk',
        name: 'work light',
        icon: 'mdi:desk-lamp',
        show_state: true,
        show_brightness: true,
        show_more_info: true,
      });
      const simple = create({ entity: 'light.simple', show_brightness: true });
      const offline = create({ entity: 'light.offline' });
      const urlCard = create({
        entity: 'light.simple',
        tap_action: { action: 'url', url_path: 'https://example.com/light' },
      });

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function run() {
        await customElements.whenDefined('terminal-light-card');
        await new Promise((resolve) => requestAnimationFrame(resolve));

        const card = light.shadowRoot.querySelector('.card');
        const style = getComputedStyle(card);
        assert(style.borderTopWidth === '1px', 'border is not 1px');
        assert(style.borderRadius === '0px', 'corners are not square');
        assert(!light.shadowRoot.querySelector('.title'), 'light card contains a border title');
        assert(light.shadowRoot.querySelector('.name').textContent === 'work light', 'custom name missing');
        assert(light.shadowRoot.querySelector('.state').textContent === 'ON', 'formatted state missing');
        assert(light.shadowRoot.querySelector('.icon').icon === 'mdi:desk-lamp', 'custom icon missing');
        assert(card.dataset.state === 'on', 'on state missing');
        assert(!light.shadowRoot.querySelector('.brightness').hidden, 'brightness is hidden');
        assert(light.getCardSize() === 2, 'brightness card size is not 2');
        assert(simple.getCardSize() === 1, 'onoff-only light size is not 1');
        assert(offline.shadowRoot.querySelector('.card').dataset.state === 'unavailable', 'unavailable state missing');
        assert(
          offline.shadowRoot.querySelector('input[type="range"]').disabled,
          'unavailable brightness control is enabled'
        );

        light.shadowRoot.querySelector('.main').click();
        assert(calls[0][0] === 'light' && calls[0][1] === 'toggle', 'tap did not toggle light');
        assert(calls[0][3].entity_id === 'light.desk', 'toggle target is wrong');

        const slider = light.shadowRoot.querySelector('input[type="range"]');
        slider.value = '42';
        slider.dispatchEvent(new Event('change', { bubbles: true }));
        assert(calls[1][1] === 'turn_on', 'brightness did not call turn_on');
        assert(calls[1][2].brightness_pct === 42, 'brightness value is wrong');

        let moreInfoEntity = null;
        light.addEventListener('hass-more-info', (event) => {
          moreInfoEntity = event.detail.entityId;
        });
        light.shadowRoot.querySelector('.more').click();
        assert(moreInfoEntity === 'light.desk', 'more-info target is wrong');

        const originalOpen = window.open;
        let openArgs = null;
        window.open = (...args) => {
          openArgs = args;
          return null;
        };
        urlCard.shadowRoot.querySelector('.main').click();
        assert(openArgs?.[0] === 'https://example.com/light', 'HTTPS URL action failed');
        assert(openArgs?.[2] === 'noopener,noreferrer', 'URL action lacks opener isolation');
        openArgs = null;
        urlCard.setConfig({
          entity: 'light.simple',
          tap_action: { action: 'url', url_path: 'javascript:alert(1)' },
        });
        urlCard.shadowRoot.querySelector('.main').click();
        assert(openArgs === null, 'unsafe URL protocol was opened');
        window.open = originalOpen;

        let invalidEntity = false;
        try {
          document.createElement('terminal-light-card').setConfig({ entity: 'switch.nope' });
        } catch (_error) {
          invalidEntity = true;
        }
        assert(invalidEntity, 'non-light entity was accepted');
        assert(window.customCards.some((entry) => entry.type === 'terminal-light-card'), 'picker metadata missing');
        const form = document.createElement('terminal-light-card').constructor.getConfigForm();
        assert(form.schema.some((field) => field.name === 'entity'), 'entity form field missing');
        assert(!form.schema.some((field) => field.name === 'title'), 'light editor exposes a title field');
        assert(
          form.schema.some((field) => field.name === 'tap_action'),
          'tap action form field missing'
        );

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal-light-card';
        document.querySelector('#result').textContent = [
          'PASS: continuous square 1px border without border title',
          'PASS: on/off/unavailable state rendering',
          'PASS: toggle, brightness, more-info and safe URL actions',
          'PASS: card picker and visual editor hooks',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal-light-card';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
