<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terminal-light-card test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --error-color: #f38ba8;
      }
      body { background: #11111b; color: #cdd6f4; padding: 24px; }
      terminal-light-card { display: block; width: 420px; margin-bottom: 16px; }
    </style>
    <script>
      const resizeObservers = [];
      window.ResizeObserver = class {
        constructor(callback) {
          this.callback = callback;
          this.targets = new Set();
          resizeObservers.push(this);
        }
        observe(target) { this.targets.add(target); }
        disconnect() { this.targets.clear(); }
      };
      window.triggerResizeObserver = (target) => {
        for (const observer of resizeObservers) {
          if (observer.targets.has(target)) observer.callback([{ target }], observer);
        }
      };
      customElements.define('ha-icon', class extends HTMLElement {});
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <main id="cards"></main>
    <pre id="result">WAITING</pre>
    <script type="module">
      const calls = [];
      const hass = {
        states: {
          'light.desk': {
            entity_id: 'light.desk',
            state: 'on',
            attributes: {
              friendly_name: 'Desk light',
              brightness: 128,
              color_mode: 'hs',
              rgb_color: [10, 120, 240],
              hs_color: [120, 60],
              color_temp_kelvin: 3500,
              min_color_temp_kelvin: 2000,
              max_color_temp_kelvin: 6500,
              supported_color_modes: ['hs', 'color_temp'],
            },
          },
          'light.simple': {
            entity_id: 'light.simple',
            state: 'off',
            attributes: {
              friendly_name: 'Simple light',
              supported_color_modes: ['onoff'],
            },
          },
          'light.dimmed_off': {
            entity_id: 'light.dimmed_off',
            state: 'off',
            attributes: {
              friendly_name: 'Dimmed off light',
              brightness: 3,
              supported_color_modes: ['brightness'],
            },
          },
          'light.warm': {
            entity_id: 'light.warm',
            state: 'on',
            attributes: {
              friendly_name: 'Warm light',
              color_mode: 'color_temp',
              color_temp_kelvin: 2400,
              min_color_temp_kelvin: 2000,
              max_color_temp_kelvin: 6500,
              brightness: 180,
              supported_color_modes: ['color_temp'],
            },
          },
          'light.offline': {
            entity_id: 'light.offline',
            state: 'unavailable',
            attributes: {
              friendly_name: 'Offline light',
              brightness: null,
              supported_color_modes: ['brightness'],
            },
          },
        },
        formatEntityState: (entity) => entity.state.toUpperCase(),
        callService: (...args) => calls.push(args),
      };

      function create(config) {
        const card = document.createElement('terminal-light-card');
        card.setConfig(config);
        card.hass = hass;
        document.querySelector('#cards').append(card);
        return card;
      }

      const light = create({
        entity: 'light.desk',
        name: 'work light',
        icon: 'mdi:desk-lamp',
        show_state: true,
        show_brightness: true,
        show_hue: true,
        show_color_temp: true,
        use_light_color: true,
        accent_color: [203, 166, 247],
        more_icon: 'mdi:tune-variant',
        show_more_info: true,
      });
      const simple = create({ entity: 'light.simple', show_brightness: true });
      const dimmedOff = create({
        entity: 'light.dimmed_off',
        show_brightness: true,
        controls_expanded: true,
      });
      const warm = create({ entity: 'light.warm', use_light_color: true });
      const offline = create({ entity: 'light.offline', controls_expanded: true });
      const urlCard = create({
        entity: 'light.simple',
        tap_action: { action: 'url', url_path: 'https://example.com/light' },
      });

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function nextLayout() {
        await new Promise((resolve) => setTimeout(resolve, 30));
      }

      async function waitFor(condition, message) {
        const deadline = performance.now() + 2000;
        while (!condition() && performance.now() < deadline) {
          await nextLayout();
        }
        assert(condition(), message);
      }

      async function run() {
        await customElements.whenDefined('terminal-light-card');
        await nextLayout();

        const card = light.shadowRoot.querySelector('.card');
        const style = getComputedStyle(card);
        assert(style.borderTopWidth === '1px', 'border is not 1px');
        assert(style.borderRadius === '0px', 'corners are not square');
        assert(!light.shadowRoot.querySelector('.title'), 'light card contains a border title');
        assert(light.shadowRoot.querySelector('.name').textContent === 'work light', 'custom name missing');
        assert(light.shadowRoot.querySelector('.state').textContent === 'on', 'state is not lowercase');
        assert(light.shadowRoot.querySelector('.icon').icon === 'mdi:desk-lamp', 'custom icon missing');
        assert(card.dataset.state === 'on', 'on state missing');
        assert(card.dataset.lightColor === 'true', 'active RGB color feedback is missing');
        assert(
          card.style.getPropertyValue('--terminal-light-color') === 'rgb(10 120 240)',
          'RGB light color was not exposed to the card'
        );
        assert(
          getComputedStyle(light.shadowRoot.querySelector('.icon')).color === 'rgb(10, 120, 240)',
          'light icon does not use the active RGB color'
        );
        assert(
          getComputedStyle(card).borderTopColor === 'rgb(10, 120, 240)',
          'light border does not use the active RGB color'
        );
        assert(
          light.style.getPropertyValue('--terminal-card-accent') === 'rgb(203 166 247)',
          'configured light accent color is missing'
        );
        const warmColor = warm.shadowRoot.querySelector('.card')
          .style.getPropertyValue('--terminal-light-color');
        assert(warmColor.startsWith('rgb('), 'color-temperature feedback is missing');
        assert(warmColor !== 'rgb(10 120 240)', 'temperature feedback reused the RGB color');
        assert(!style.transitionProperty.includes('box-shadow'), 'light still transitions a glow');
        assert(style.boxShadow === 'none', 'light still renders a glow');

        const controls = light.shadowRoot.querySelector('.controls');
        const more = light.shadowRoot.querySelector('.more');
        const moreIcon = more.querySelector('ha-icon');
        assert(moreIcon.icon === 'mdi:tune-variant', 'custom light controls icon is missing');
        assert(controls.hidden, 'controls are not collapsed by default');
        assert(light.getCardSize() === 1, 'collapsed card size is not 1');
        assert(getComputedStyle(more).borderRadius === '0px', 'controls button is not square');
        const moreRect = more.getBoundingClientRect();
        const moreIconRect = moreIcon.getBoundingClientRect();
        assert(
          Math.abs((moreRect.left + moreRect.width / 2) - (moreIconRect.left + moreIconRect.width / 2)) < 0.5 &&
          Math.abs((moreRect.top + moreRect.height / 2) - (moreIconRect.top + moreIconRect.height / 2)) < 0.5,
          'controls icon is not centered in its hover target'
        );

        let moreInfoEntity = null;
        light.addEventListener('hass-more-info', (event) => {
          moreInfoEntity = event.detail.entityId;
        });
        more.click();
        await waitFor(
          () => light.shadowRoot.querySelectorAll('[data-control="brightness"] .segment').length > 0,
          'responsive brightness segments were not created'
        );
        assert(!controls.hidden, 'controls button did not expand the panel');
        assert(more.getAttribute('aria-expanded') === 'true', 'expanded state is not exposed');
        assert(moreInfoEntity === null, 'controls button still opens more-info');
        assert(light.getCardSize() === 3, 'expanded multi-control size is wrong');

        const brightness = light.shadowRoot.querySelector('[data-control="brightness"]');
        const activeBrightness = brightness.querySelector('.segment[data-active="true"]');
        assert(
          getComputedStyle(activeBrightness).backgroundColor === 'rgb(10, 120, 240)',
          'brightness segments do not use the active light color'
        );
        assert(
          getComputedStyle(more).color === 'rgb(10, 120, 240)',
          'expanded controls icon does not use the active light color'
        );
        const hue = light.shadowRoot.querySelector('[data-control="hue"]');
        const temperature = light.shadowRoot.querySelector('[data-control="temperature"]');
        assert(!brightness.hidden && !hue.hidden && !temperature.hidden, 'supported controls are hidden');
        assert(brightness.querySelector('.control-value').textContent === '50%', 'brightness value is wrong');
        assert(hue.querySelector('.control-value').textContent === '120°', 'hue value is wrong');
        assert(temperature.querySelector('.control-value').textContent === '3500K', 'temperature value is wrong');
        const temperatureSegments = [...temperature.querySelectorAll('.segment')];
        const warmSegmentColor = getComputedStyle(temperatureSegments[0]).backgroundColor;
        const coolSegmentColor = getComputedStyle(temperatureSegments.at(-1)).backgroundColor;
        assert(warmSegmentColor === 'rgb(250, 179, 135)', 'temperature left side is not warm');
        assert(coolSegmentColor === 'rgb(137, 180, 250)', 'temperature right side is not cold');

        const valueRect = brightness.querySelector('.control-value').getBoundingClientRect();
        const alignedMoreRect = more.getBoundingClientRect();
        assert(
          Math.abs((valueRect.left + valueRect.width / 2) - (alignedMoreRect.left + alignedMoreRect.width / 2)) < 0.5,
          'brightness percentage is not centered below the controls button'
        );

        const initialSegments = brightness.querySelectorAll('.segment').length;
        assert(initialSegments >= 2, 'brightness dimmer has too few segments');
        light.style.width = '190px';
        light.getBoundingClientRect();
        window.triggerResizeObserver(card);
        assert(
          brightness.querySelectorAll('.segment').length > 0 &&
            brightness.querySelectorAll('.segment').length < initialSegments,
          'segment count did not shrink with the card width'
        );
        const narrowSegments = [...brightness.querySelectorAll('.segment')];
        for (let index = 1; index < narrowSegments.length; index += 1) {
          assert(
            narrowSegments[index].getBoundingClientRect().left >=
              narrowSegments[index - 1].getBoundingClientRect().right,
            'responsive brightness segments overlap'
          );
        }
        const narrowSegmentCount = narrowSegments.length;
        light.style.width = '420px';
        light.getBoundingClientRect();
        window.triggerResizeObserver(card);
        assert(
          brightness.querySelectorAll('.segment').length > narrowSegmentCount,
          'segment count did not grow after restoring width'
        );

        assert(simple.getCardSize() === 1, 'onoff-only light size is not 1');
        assert(simple.shadowRoot.querySelector('.more').hidden, 'control-less light shows expand button');
        assert(
          dimmedOff.shadowRoot.querySelector('[data-control="brightness"] .control-value').textContent === '0%',
          'off light does not display 0% brightness'
        );
        assert(
          ![...dimmedOff.shadowRoot.querySelectorAll('[data-control="brightness"] .segment')]
            .some((segment) => segment.dataset.active === 'true'),
          'off light still has active brightness segments'
        );
        assert(offline.shadowRoot.querySelector('.card').dataset.state === 'unavailable', 'unavailable state missing');
        assert(
          offline.shadowRoot.querySelector('[data-control="brightness"] input').disabled,
          'unavailable brightness control is enabled'
        );

        light.shadowRoot.querySelector('.main').click();
        assert(calls[0][0] === 'light' && calls[0][1] === 'toggle', 'tap did not toggle light');
        assert(calls[0][3].entity_id === 'light.desk', 'toggle target is wrong');

        const brightnessInput = brightness.querySelector('input');
        brightnessInput.value = '42';
        brightnessInput.dispatchEvent(new Event('input', { bubbles: true }));
        brightnessInput.dispatchEvent(new Event('change', { bubbles: true }));
        assert(calls[1][1] === 'turn_on', 'brightness did not call turn_on');
        assert(calls[1][2].brightness_pct === 42, 'brightness value is wrong');
        assert(brightness.querySelector('.control-value').textContent === '42%', 'live brightness value missing');

        brightnessInput.value = '0';
        brightnessInput.dispatchEvent(new Event('change', { bubbles: true }));
        assert(calls[2][1] === 'turn_off', 'zero brightness did not turn the light off');

        const hueInput = hue.querySelector('input');
        hueInput.value = '210';
        hueInput.dispatchEvent(new Event('input', { bubbles: true }));
        hueInput.dispatchEvent(new Event('change', { bubbles: true }));
        assert(calls[3][1] === 'turn_on', 'hue did not call turn_on');
        assert(calls[3][2].hs_color[0] === 210 && calls[3][2].hs_color[1] === 60, 'hue payload is wrong');

        const temperatureInput = temperature.querySelector('input');
        temperatureInput.value = temperatureInput.min;
        temperatureInput.dispatchEvent(new Event('input', { bubbles: true }));
        assert(
          temperature.querySelector('.segment[data-selected="true"]') ===
            temperature.querySelector('.segment'),
          'minimum warm temperature is not selected on the left'
        );
        temperatureInput.value = temperatureInput.max;
        temperatureInput.dispatchEvent(new Event('input', { bubbles: true }));
        assert(
          temperature.querySelector('.segment[data-selected="true"]') ===
            [...temperature.querySelectorAll('.segment')].at(-1),
          'maximum cold temperature is not selected on the right'
        );
        temperatureInput.value = '4200';
        temperatureInput.dispatchEvent(new Event('input', { bubbles: true }));
        temperatureInput.dispatchEvent(new Event('change', { bubbles: true }));
        assert(calls[4][1] === 'turn_on', 'temperature did not call turn_on');
        assert(calls[4][2].color_temp_kelvin === 4200, 'temperature payload is wrong');

        more.click();
        assert(controls.hidden, 'controls button did not collapse the panel');

        const originalOpen = window.open;
        let openArgs = null;
        window.open = (...args) => {
          openArgs = args;
          return null;
        };
        urlCard.shadowRoot.querySelector('.main').click();
        assert(openArgs?.[0] === 'https://example.com/light', 'HTTPS URL action failed');
        assert(openArgs?.[2] === 'noopener,noreferrer', 'URL action lacks opener isolation');
        openArgs = null;
        urlCard.setConfig({
          entity: 'light.simple',
          tap_action: { action: 'url', url_path: 'javascript:alert(1)' },
        });
        urlCard.shadowRoot.querySelector('.main').click();
        assert(openArgs === null, 'unsafe URL protocol was opened');
        window.open = originalOpen;

        let invalidEntity = false;
        try {
          document.createElement('terminal-light-card').setConfig({ entity: 'switch.nope' });
        } catch (_error) {
          invalidEntity = true;
        }
        assert(invalidEntity, 'non-light entity was accepted');
        let invalidColor = false;
        try {
          document.createElement('terminal-light-card').setConfig({
            entity: 'light.desk',
            accent_color: ['bad', 0, 0],
          });
        } catch (_error) {
          invalidColor = true;
        }
        assert(invalidColor, 'invalid light accent color was accepted');
        assert(window.customCards.some((entry) => entry.type === 'terminal-light-card'), 'picker metadata missing');
        const form = document.createElement('terminal-light-card').constructor.getConfigForm();
        const fields = form.schema.flatMap((item) => item.schema || [item]);
        assert(fields.some((field) => field.name === 'entity'), 'entity form field missing');
        assert(fields.some((field) => field.name === 'show_hue'), 'hue form field missing');
        assert(fields.some((field) => field.name === 'show_color_temp'), 'temperature form field missing');
        assert(fields.some((field) => field.name === 'use_light_color'), 'light color form field missing');
        assert(fields.some((field) => field.name === 'more_icon'), 'light controls icon field missing');
        assert(fields.some((field) => field.name === 'show_controls'), 'controls button form field missing');
        assert(fields.some((field) => field.name === 'controls_expanded'), 'expanded form field missing');
        assert(form.schema.some((field) => field.type === 'expandable'), 'native expandable forms missing');
        assert(!fields.some((field) => field.name === 'title'), 'light editor exposes a title field');

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal-light-card';
        document.querySelector('#result').textContent = [
          'PASS: square centered controls toggle with aligned values',
          'PASS: width-responsive non-overlapping brightness segments',
          'PASS: optional RGB/color-temperature icon and border feedback',
          'PASS: lowercase states and off lights display 0%',
          'PASS: brightness, hue and color-temperature services',
          'PASS: native expandable config form and safe actions',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal-light-card';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
