<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terminal-navigation-card test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --error-color: #f38ba8;
      }
      body { background: #11111b; color: #cdd6f4; padding: 24px; }
      terminal-navigation-card { display: block; width: 420px; margin-bottom: 16px; }
      #equal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 852px; }
      #equal-grid terminal-navigation-card { width: auto; margin: 0; }
    </style>
    <script>
      customElements.define('ha-icon', class extends HTMLElement {});
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <main id="cards"></main>
    <pre id="result">WAITING</pre>
    <script type="module">
      const templateSubscriptions = [];
      const connection = {
        subscribeMessage(callback, params) {
          const subscription = { callback, params, unsubscribed: false };
          templateSubscriptions.push(subscription);
          return Promise.resolve(() => { subscription.unsubscribed = true; });
        },
      };
      const hass = {
        connection,
        user: { name: 'Test User' },
        states: {
          'sensor.destination': {
            entity_id: 'sensor.destination',
            state: 'open',
            attributes: { friendly_name: 'Destination state' },
          },
        },
        formatEntityState: (entity) => entity.state.toUpperCase(),
      };

      function create(config, hassContext = null) {
        const card = document.createElement('terminal-navigation-card');
        card.setConfig(config);
        document.querySelector('#cards').append(card);
        if (hassContext) card.hass = hassContext;
        return card;
      }

      const continuous = create({
        name: 'kitchen',
        navigation_path: '/dashboard-test/kitchen',
        icon: 'mdi:fridge',
        variant: 'continuous',
        show_path: true,
      });
      const pane = create({
        name: 'system',
        navigation_path: '/config/dashboard',
        icon: 'mdi:cog',
        variant: 'pane',
        label: 'settings',
        title_position: 'right',
        accent_color: [137, 220, 235],
        more_icon: 'mdi:arrow-right-bold',
      });
      const entityState = create({
        name: 'entity state',
        navigation_path: '/lovelace/entity',
        entity: 'sensor.destination',
      }, hass);
      const templated = create({
        name: 'template state',
        navigation_path: '/lovelace/template',
        entity: 'sensor.destination',
        state_template: '{{ states(config.entity) }}',
      }, hass);
      const equalGrid = document.createElement('div');
      equalGrid.id = 'equal-grid';
      const gridContinuous = create({
        name: 'continuous grid',
        navigation_path: '/lovelace',
        variant: 'continuous',
      });
      const gridPane = create({
        name: 'pane grid',
        navigation_path: '/lovelace',
        variant: 'pane',
      });
      equalGrid.style.height = '220px';
      equalGrid.append(gridContinuous, gridPane);
      document.querySelector('#cards').append(equalGrid);

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function run() {
        await customElements.whenDefined('terminal-navigation-card');

        const continuousCard = continuous.shadowRoot.querySelector('.card');
        const continuousStyle = getComputedStyle(continuousCard);
        assert(continuousStyle.borderRadius === '0px', 'navigation corners are not square');
        assert(!continuousStyle.transitionProperty.includes('box-shadow'), 'navigation still transitions a glow');
        assert(continuousStyle.boxShadow === 'none', 'navigation still renders a glow');
        assert(
          continuous.shadowRoot.querySelector('style').textContent.includes('.card:hover .name'),
          'navigation name does not adopt the hover accent'
        );
        assert(continuousCard.dataset.variant === 'continuous', 'continuous variant missing');
        assert(continuous.shadowRoot.querySelector('.border-title').hidden, 'continuous variant has border title');
        assert(!continuous.shadowRoot.querySelector('.name').hidden, 'continuous name is hidden');
        assert(continuous.shadowRoot.querySelector('.name').textContent === 'kitchen', 'navigation name missing');
        assert(
          continuous.shadowRoot.querySelector('.secondary').textContent === '/dashboard-test/kitchen',
          'navigation path is not displayed'
        );
        assert(continuous.shadowRoot.querySelector('.icon').icon === 'mdi:fridge', 'navigation icon missing');

        const paneCard = pane.shadowRoot.querySelector('.card');
        const paneRect = paneCard.getBoundingClientRect();
        const title = pane.shadowRoot.querySelector('.border-title');
        const titleRect = title.getBoundingClientRect();
        assert(paneCard.dataset.variant === 'pane', 'pane variant missing');
        assert(!title.hidden && title.textContent === 'system', 'pane border title missing');
        assert(title.dataset.titlePosition === 'right', 'pane title position is missing');
        assert(getComputedStyle(title).right === '12px', 'pane title is not positioned right');
        assert(
          pane.style.getPropertyValue('--terminal-card-accent') === 'rgb(137 220 235)',
          'navigation accent color is missing'
        );
        assert(titleRect.top < paneRect.top && titleRect.bottom > paneRect.top, 'pane title does not cut border');
        assert(pane.shadowRoot.querySelector('.name').hidden, 'pane repeats name in content');
        assert(pane.shadowRoot.querySelector('.secondary').textContent === 'settings', 'pane label missing');
        assert(
          pane.shadowRoot.querySelector('.arrow').icon === 'mdi:arrow-right-bold',
          'custom navigation icon is missing'
        );
        assert(
          entityState.shadowRoot.querySelector('.secondary').textContent === 'open',
          'navigation entity state is not formatted and lowercased'
        );
        assert(templateSubscriptions.length === 1, 'navigation template subscription is missing');
        const firstTemplateSubscription = templateSubscriptions[0];
        assert(firstTemplateSubscription.params.type === 'render_template', 'wrong template websocket type');
        assert(
          firstTemplateSubscription.params.template === '{{ states(config.entity) }}',
          'wrong navigation template was subscribed'
        );
        assert(
          firstTemplateSubscription.params.entity_ids === 'sensor.destination',
          'template entity tracking hint is missing'
        );
        assert(
          templated.shadowRoot.querySelector('.secondary').textContent === 'open',
          'entity state is not used while the template is pending'
        );
        firstTemplateSubscription.callback({
          result: '<b>template result</b>',
          listeners: { all: false, domains: [], entities: ['sensor.destination'], time: false },
        });
        assert(
          templated.shadowRoot.querySelector('.secondary').textContent === '<b>template result</b>',
          'reactive template result is not displayed literally'
        );
        assert(!templated.shadowRoot.querySelector('.secondary b'), 'template output was interpreted as HTML');

        const updatedHass = {
          ...hass,
          states: {
            ...hass.states,
            'sensor.destination': {
              ...hass.states['sensor.destination'],
              state: 'closed',
            },
          },
        };
        entityState.hass = updatedHass;
        assert(
          entityState.shadowRoot.querySelector('.secondary').textContent === 'closed',
          'navigation entity state did not react to hass updates'
        );

        templated.setConfig({
          name: 'template state',
          navigation_path: '/lovelace/template',
          entity: 'sensor.destination',
          state_template: '{{ states(config.entity) | upper }}',
        });
        await Promise.resolve();
        assert(firstTemplateSubscription.unsubscribed, 'old template subscription was not stopped');
        const secondTemplateSubscription = templateSubscriptions[1];
        firstTemplateSubscription.callback({ result: 'stale result', listeners: {} });
        assert(
          templated.shadowRoot.querySelector('.secondary').textContent === 'open',
          'stale template callback overwrote current fallback content'
        );
        secondTemplateSubscription.callback({ result: 'OPEN', listeners: {} });
        assert(
          templated.shadowRoot.querySelector('.secondary').textContent === 'OPEN',
          'replacement template result is missing'
        );

        const continuousGridRect = gridContinuous.getBoundingClientRect();
        const paneGridRect = gridPane.getBoundingClientRect();
        const paneGridCardRect = gridPane.shadowRoot.querySelector('.card').getBoundingClientRect();
        assert(
          Math.abs(continuousGridRect.height - paneGridRect.height) < 0.5,
          'navigation variants do not share equal grid-row height'
        );
        assert(
          paneGridCardRect.bottom <= paneGridRect.bottom + 0.5,
          'pane navigation card overflows its stretched grid row'
        );
        const gridMainRect = gridContinuous.shadowRoot.querySelector('.main').getBoundingClientRect();
        const gridCardRect = gridContinuous.shadowRoot.querySelector('.card').getBoundingClientRect();
        assert(gridMainRect.height <= 73, 'navigation main content stretches vertically');
        assert(
          Math.abs(gridMainRect.top - gridCardRect.top) < 1.5,
          'navigation content is not pinned to the top like light-card content'
        );

        const originalPushState = History.prototype.pushState;
        const navigations = [];
        History.prototype.pushState = (_state, _title, path) => navigations.push(path);
        let locationChanged = 0;
        window.addEventListener('location-changed', () => { locationChanged += 1; });
        continuous.shadowRoot.querySelector('.main').click();
        assert(
          navigations[0]?.endsWith('/dashboard-test/kitchen'),
          `click navigation path is wrong: ${JSON.stringify(navigations)}`
        );
        assert(locationChanged === 1, 'click did not dispatch location-changed');
        pane.shadowRoot.querySelector('.main').dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Enter', bubbles: true })
        );
        assert(navigations[1]?.endsWith('/config/dashboard'), 'keyboard navigation path is wrong');
        assert(locationChanged === 2, 'keyboard did not dispatch location-changed');
        History.prototype.pushState = originalPushState;

        templated.remove();
        await Promise.resolve();
        assert(secondTemplateSubscription.unsubscribed, 'disconnect did not stop template subscription');
        document.querySelector('#cards').append(templated);
        templated.hass = hass;
        assert(templateSubscriptions.length === 3, 'reconnect did not create exactly one template subscription');

        let invalidConfig = 0;
        for (const config of [
          { navigation_path: '/lovelace' },
          { name: 'missing path' },
          { name: 'bad variant', navigation_path: '/lovelace', variant: 'round' },
          { name: 'external', navigation_path: 'https://example.com/config' },
          { name: 'protocol relative', navigation_path: '//example.com/config' },
          { name: 'bad title side', navigation_path: '/lovelace', title_position: 'center' },
          { name: 'bad color', navigation_path: '/lovelace', accent_color: [999, 0, 0] },
          { name: 'bad icon', navigation_path: '/lovelace', more_icon: '' },
          { name: 'bad template', navigation_path: '/lovelace', state_template: 42 },
        ]) {
          try {
            document.createElement('terminal-navigation-card').setConfig(config);
          } catch (_error) {
            invalidConfig += 1;
          }
        }
        assert(invalidConfig === 9, 'invalid navigation configuration was accepted');
        assert(continuous.getCardSize() === 1, 'navigation card size is wrong');
        assert(
          window.customCards.some((entry) => entry.type === 'terminal-navigation-card'),
          'navigation picker metadata missing'
        );
        const form = document.createElement('terminal-navigation-card').constructor.getConfigForm();
        const fields = form.schema.flatMap((item) => item.schema || [item]);
        const pathField = fields.find((field) => field.name === 'navigation_path');
        assert(pathField.selector.navigation, 'native navigation selector missing');
        const variantField = fields.find((field) => field.name === 'variant');
        assert(variantField.selector.select.options.length === 2, 'variant selector is incomplete');
        assert(fields.some((field) => field.name === 'more_icon'), 'navigation icon field missing');
        assert(fields.find((field) => field.name === 'entity').selector.entity, 'navigation entity selector missing');
        assert(
          fields.find((field) => field.name === 'state_template').selector.template,
          'native navigation template selector missing'
        );

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal-navigation-card';
        document.querySelector('#result').textContent = [
          'PASS: continuous and title-in-border navigation variants',
          'PASS: square border, title overlay, hover accent without glow and equal-row sizing',
          'PASS: click and keyboard internal navigation',
          'PASS: native navigation/variant form and picker metadata',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal-navigation-card';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
