<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>terminal mobile popup test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --error-color: #f38ba8;
      }
      body { margin: 0; background: #11111b; color: #cdd6f4; }
      terminal-light-card { display: block; width: 100%; }
    </style>
    <script>customElements.define('ha-icon', class extends HTMLElement {});</script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <pre id="result">WAITING</pre>
    <script type="module">
      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function run() {
        await customElements.whenDefined('terminal-light-card');
        assert(innerWidth <= 600, `mobile viewport was not applied: ${innerWidth}px`);
        const hass = {
          states: {
            'light.mobile': {
              entity_id: 'light.mobile',
              state: 'on',
              attributes: {
                friendly_name: 'Mobile popup light',
                brightness: 180,
                hs_color: [210, 70],
                color_temp_kelvin: 3500,
                min_color_temp_kelvin: 2000,
                max_color_temp_kelvin: 6500,
                supported_color_modes: ['hs', 'color_temp'],
              },
            },
          },
          formatEntityState: () => 'ON',
          callService() {},
          callWS: () => Promise.resolve([]),
        };
        const card = document.createElement('terminal-light-card');
        card.setConfig({
          entity: 'light.mobile',
          tap_action: { action: 'more-info' },
        });
        card.hass = hass;
        document.body.prepend(card);
        card.shadowRoot.querySelector('.main').click();

        const popup = document.querySelector('terminal-entity-popup');
        const shell = popup.shadowRoot.querySelector('.dialog-shell');
        const frame = popup.shadowRoot.querySelector('.dialog-frame');
        const dialog = popup.shadowRoot.querySelector('.dialog');
        const body = popup.shadowRoot.querySelector('.body');
        const title = popup.shadowRoot.querySelector('.border-title');
        const shellRect = shell.getBoundingClientRect();
        const frameRect = frame.getBoundingClientRect();
        const dialogRect = dialog.getBoundingClientRect();
        const expectedTop = innerHeight * 0.12;
        const expectedBottom = innerHeight * 0.12;

        assert(!popup.hidden, 'mobile popup did not open');
        assert(
          Math.abs(shellRect.width - (innerWidth - 16)) < 1 &&
          Math.abs(shellRect.left - 8) < 1 &&
          Math.abs(innerWidth - shellRect.right - 8) < 1,
          'mobile popup does not keep an 8px side gap'
        );
        assert(
          Math.abs(shellRect.top - expectedTop) < 4,
          `mobile popup top gap is not 12vh: ${shellRect.top}px instead of ${expectedTop}px`
        );
        assert(
          Math.abs(innerHeight - shellRect.bottom - expectedBottom) < 4,
          `mobile popup bottom gap is not 12vh: ${innerHeight - shellRect.bottom}px instead of ${expectedBottom}px`
        );
        assert(shellRect.height > innerHeight * 0.74, 'mobile popup does not use the remaining screen height');
        assert(Math.abs(dialogRect.top - shellRect.top) < 0.5, 'accent border is not directly inside the outer area');
        assert(Math.abs(frameRect.height - dialogRect.height) < 0.5, 'mobile dialog does not fill its inner frame');
        assert(getComputedStyle(body).overflowY === 'auto', 'mobile popup body is not independently scrollable');
        assert(getComputedStyle(body).alignContent === 'start', 'mobile popup sections are stretched vertically');
        assert(getComputedStyle(title).fontSize === '18px', 'mobile title does not use its responsive size');
        assert(title.textContent === 'more-info', 'mobile popup does not use the default more-info title');
        assert(
          popup.shadowRoot.querySelector('.entity-name').textContent === 'Mobile popup light',
          'mobile popup does not show the entity name above the state'
        );
        assert(getComputedStyle(shell).borderTopWidth === '0px', 'mobile background shell has a border');
        assert(getComputedStyle(shell).paddingTop === '0px', 'dark shell spacing remains outside the accent border');
        assert(
          getComputedStyle(popup.shadowRoot.querySelector('.backdrop')).backgroundColor === 'rgb(24, 24, 37)',
          'mobile outer area does not use the card background color'
        );
        assert(body.getBoundingClientRect().height > innerHeight / 2, 'mobile controls have too little vertical space');
        assert(popup.shadowRoot.querySelectorAll('.range').length === 3, 'mobile popup lost controls');
        const logsToggle = popup.shadowRoot.querySelector('.logs-toggle');
        assert(logsToggle, 'mobile popup lost the logs field');
        logsToggle.click();
        await new Promise((resolve) => setTimeout(resolve, 10));
        const logsWrapper = popup.shadowRoot.querySelector('.logbook-section');
        assert(logsWrapper.dataset.open === 'true', 'mobile logs do not expand inside their wrapper');
        assert(getComputedStyle(logsWrapper).borderBottomWidth === '1px', 'mobile logs wrapper border is missing');
        const logsIconRect = logsToggle.querySelector('ha-icon').getBoundingClientRect();
        const logsWrapperRect = logsWrapper.getBoundingClientRect();
        assert(
          logsWrapperRect.right - logsIconRect.right <= 15,
          'expanded logs dropdown icon is not aligned on the right'
        );

        popup.close();
        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal mobile popup';
        document.querySelector('#result').textContent = [
          'PASS: card-background outer area leads directly into accent border and card surface',
          'PASS: popup uses 8px sides and matching 12vh top/bottom clearance',
          'PASS: more-info title, entity heading and bordered expanded logs',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal mobile popup';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
