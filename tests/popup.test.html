<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terminal entity popup test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --error-color: #f38ba8;
      }
      body { background: #11111b; color: #cdd6f4; padding: 24px; }
      terminal-light-card { display: block; width: 420px; }
    </style>
    <script>
      customElements.define('ha-icon', class extends HTMLElement {});
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <main id="cards"></main>
    <pre id="result">WAITING</pre>
    <script type="module">
      const calls = [];
      const wsCalls = [];
      const logbookEntries = [
        { when: 1700000000, state: 'off', name: 'Popup light' },
        { when: 1700000100, state: 'on', name: 'Popup light', source: 'automation evening' },
        { when: 1700000200, state: 'off', name: 'Popup light' },
        { when: 1700000300, state: 'on', name: 'Popup light' },
        { when: '2023-11-14T22:20:00.000Z', state: 'off', name: 'Popup light' },
        { when: 1700000500, state: 'on', name: 'Popup light' },
        { when: 1700000600, state: 'off', name: 'Popup light', context_service: 'light.turn_off' },
      ];
      const hass = {
        states: {
          'light.popup': {
            entity_id: 'light.popup',
            state: 'on',
            attributes: {
              friendly_name: 'Popup light',
              brightness: 128,
              color_mode: 'rgb',
              rgb_color: [40, 180, 90],
              hs_color: [140, 70],
              color_temp_kelvin: 3200,
              min_color_temp_kelvin: 2000,
              max_color_temp_kelvin: 6500,
              supported_color_modes: ['rgb', 'color_temp'],
            },
          },
        },
        locale: { language: 'en' },
        formatEntityState: (entity) => entity.state.toUpperCase(),
        callService: (...args) => calls.push(args),
        callWS: (params) => {
          wsCalls.push(params);
          return Promise.resolve(logbookEntries);
        },
      };

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function wait(milliseconds) {
        await new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      async function run() {
        await customElements.whenDefined('terminal-light-card');
        let invalidLightPopupTitle = false;
        let invalidShutterPopupTitle = false;
        try {
          document.createElement('terminal-light-card').setConfig({
            entity: 'light.popup',
            popup_title: ' ',
          });
        } catch (_error) { invalidLightPopupTitle = true; }
        try {
          document.createElement('terminal-shutter-card').setConfig({
            entity: 'cover.popup',
            popup_title: 42,
          });
        } catch (_error) { invalidShutterPopupTitle = true; }
        assert(invalidLightPopupTitle, 'blank Light popup title was accepted');
        assert(invalidShutterPopupTitle, 'non-string Shutter popup title was accepted');

        const card = document.createElement('terminal-light-card');
        card.setConfig({
          entity: 'light.popup',
          name: '<b>literal card name</b>',
          popup_title: '<i>literal popup title</i>',
          icon: 'mdi:desk-lamp',
          use_light_color: true,
          accent_color: [203, 166, 247],
        });
        card.hass = hass;
        document.querySelector('#cards').append(card);
        const main = card.shadowRoot.querySelector('.main');
        main.focus();

        let nativeMoreInfoCount = 0;
        card.addEventListener('hass-more-info', () => { nativeMoreInfoCount += 1; });
        main.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
        await wait(550);
        const popup = document.querySelector('terminal-entity-popup');
        assert(popup && !popup.hidden, 'pointer hold did not open the terminal popup');
        await wait(30);
        main.dispatchEvent(new PointerEvent('pointerup', { bubbles: true }));
        main.click();
        assert(calls.length === 0, 'tap action fired after a completed hold');
        assert(nativeMoreInfoCount === 0, 'hold opened native more-info');
        const popupDialog = popup.shadowRoot.querySelector('.dialog');
        const popupShell = popup.shadowRoot.querySelector('.dialog-shell');
        const popupFrame = popup.shadowRoot.querySelector('.dialog-frame');
        const popupTitle = popup.shadowRoot.querySelector('.border-title');
        const popupEntityName = popup.shadowRoot.querySelector('.entity-name');
        const dialogRect = popupDialog.getBoundingClientRect();
        const titleRect = popupTitle.getBoundingClientRect();
        const shellStyle = getComputedStyle(popupShell);
        const dialogStyle = getComputedStyle(popupDialog);
        assert(popupDialog.getAttribute('role') === 'dialog', 'popup lacks dialog role');
        assert(popupDialog.getAttribute('aria-modal') === 'true', 'popup is not modal');
        assert(shellStyle.borderTopWidth === '0px', 'popup background shell renders a border');
        assert(shellStyle.backgroundColor === dialogStyle.backgroundColor, 'popup shell does not match the dialog background');
        assert(getComputedStyle(popupFrame).overflow === 'visible', 'popup title frame clips overflow');
        assert(titleRect.top < dialogRect.top && titleRect.bottom > dialogRect.top, 'popup title is clipped above the border');
        assert(
          Number(getComputedStyle(popupTitle).zIndex) > Number(dialogStyle.zIndex),
          'popup title is stacked behind the bordered dialog'
        );
        assert(
          getComputedStyle(popup.shadowRoot.querySelector('.body')).overflowY === 'auto',
          'popup does not use a separate inner scroller'
        );
        assert(getComputedStyle(popupDialog).boxShadow === 'none', 'popup still renders a glow');
        assert(
          popupTitle.textContent === '<i>literal popup title</i>',
          'configured popup title did not override the card name'
        );
        assert(!popupTitle.querySelector('i'), 'popup interpreted its title as HTML');
        assert(
          popupEntityName.textContent === '<b>literal card name</b>' && !popupEntityName.querySelector('b'),
          'popup entity name is missing or interpreted as HTML'
        );
        assert(
          popupEntityName.nextElementSibling?.classList.contains('state'),
          'entity name is not placed directly above the state'
        );
        assert(getComputedStyle(popupTitle).fontSize === '22px', 'popup does not use the large TitleCard title');
        assert(
          getComputedStyle(popup.shadowRoot.querySelector('.dialog')).borderTopColor === 'rgb(40, 180, 90)',
          'popup does not use the active light color'
        );
        assert(popup.shadowRoot.querySelectorAll('.range').length === 3, 'popup light controls are incomplete');
        const popupBrightness = popup.shadowRoot.querySelector('.range[data-kind="brightness"]');
        const popupTemperature = popup.shadowRoot.querySelector('.range[data-kind="temperature"]');
        assert(
          popupBrightness.querySelectorAll('.segment').length > 1,
          `popup brightness is not segmented: width=${popupBrightness.querySelector('.track').getBoundingClientRect().width}, controls=${popup._rangeControls.length}, frame=${popup._layoutFrame}`
        );
        assert(
          popupTemperature.querySelectorAll('.segment').length ===
            popupBrightness.querySelectorAll('.segment').length,
          'popup segmented controls use inconsistent sizing'
        );
        const popupTempSegments = [...popupTemperature.querySelectorAll('.segment')];
        assert(
          getComputedStyle(popupTempSegments[0]).backgroundColor === 'rgb(250, 179, 135)',
          'popup temperature left side is not warm'
        );
        assert(
          getComputedStyle(popupTempSegments.at(-1)).backgroundColor === 'rgb(137, 180, 250)',
          'popup temperature right side is not cold'
        );
        const widePopupSegments = popupBrightness.querySelectorAll('.segment').length;
        popupFrame.style.width = '240px';
        popupFrame.getBoundingClientRect();
        popup._updateSegmentCounts();
        await wait(10);
        assert(
          popupBrightness.querySelectorAll('.segment').length < widePopupSegments,
          'popup segment count did not shrink with its available width'
        );
        popupFrame.style.removeProperty('width');
        popupFrame.getBoundingClientRect();
        popup._updateSegmentCounts();
        await wait(10);

        let brightness = popup.shadowRoot.querySelector('input[aria-label="bri"]');
        brightness.focus();
        popup.updateHass({ ...hass });
        brightness = popup.shadowRoot.querySelector('input[aria-label="bri"]');
        assert(
          popup.shadowRoot.activeElement === brightness,
          'focused range was lost when the popup refreshed'
        );
        brightness.value = '42';
        brightness.dispatchEvent(new Event('input', { bubbles: true }));
        brightness.dispatchEvent(new Event('change', { bubbles: true }));
        assert(calls[0][0] === 'light' && calls[0][1] === 'turn_on', 'popup brightness service is wrong');
        assert(calls[0][2].brightness_pct === 42, 'popup brightness payload is wrong');
        assert(calls[0][3].entity_id === 'light.popup', 'popup brightness target is wrong');

        let logsToggle = popup.shadowRoot.querySelector('.logs-toggle');
        assert(logsToggle && logsToggle.getAttribute('aria-expanded') === 'false', 'logs are not collapsed initially');
        logsToggle.click();
        await wait(10);
        assert(logsToggle.getAttribute('aria-expanded') === 'true', 'logs did not expand');
        const logsWrapper = popup.shadowRoot.querySelector('.logbook-section');
        assert(logsWrapper.dataset.open === 'true', 'expanded logs wrapper is not marked open');
        assert(getComputedStyle(logsWrapper).borderTopWidth === '1px', 'expanded logs have no wrapper border');
        assert(
          logsWrapper.contains(popup.shadowRoot.querySelector('.log-tree')),
          'log entries are rendered outside the logs wrapper'
        );
        assert(wsCalls.length === 1, 'logbook was not loaded exactly once on demand');
        assert(wsCalls[0].type === 'logbook/get_events', 'popup uses the wrong logbook API');
        assert(wsCalls[0].entity_ids[0] === 'light.popup', 'logbook request targets the wrong entity');
        const logbookWindow = Date.parse(wsCalls[0].end_time) - Date.parse(wsCalls[0].start_time);
        assert(Math.abs(logbookWindow - 24 * 60 * 60 * 1000) < 1000, 'logbook request is not limited to 24 hours');
        const logLines = [...popup.shadowRoot.querySelectorAll('.log-line[role="listitem"]')];
        assert(logLines.length === 6, 'popup does not limit the logbook tree to six changes');
        assert(logLines[0].querySelector('.log-value').textContent === 'off', 'newest logbook state is not first');
        assert(logLines[0].querySelector('.log-branch').textContent === '├─', 'logbook tree start branch is wrong');
        assert(logLines.at(-1).querySelector('.log-branch').textContent === '└─', 'logbook tree end branch is wrong');
        assert(
          logLines.every((line) => line.querySelector('time').dateTime),
          'numeric/ISO log timestamps do not expose machine-readable datetimes'
        );
        assert(
          popup.shadowRoot.querySelector('.log-tree').textContent.includes('light.turn_off'),
          'logbook context line is missing'
        );
        logsToggle.focus();
        popup.updateHass({ ...hass });
        logsToggle = popup.shadowRoot.querySelector('.logs-toggle');
        assert(
          popup.shadowRoot.activeElement === logsToggle,
          'focused Logbook toggle was lost when the popup refreshed'
        );
        logsToggle.click();
        logsToggle.click();
        await wait(1);
        assert(wsCalls.length === 1, 'cached logbook was fetched again');

        popup.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
        assert(popup.hidden, 'Escape did not close the popup');
        assert(card.shadowRoot.activeElement === main, 'popup did not restore focus');

        card.setConfig({
          entity: 'light.popup',
          name: 'card name fallback',
          hold_action: { action: 'more-info' },
        });
        let retryCalls = 0;
        const retryHass = {
          ...hass,
          callWS: () => {
            retryCalls += 1;
            if (retryCalls === 1) throw new Error('simulated synchronous logbook error');
            return Promise.resolve([{ when: 1700000700, state: 'recovered' }]);
          },
        };
        card.hass = retryHass;
        const beforeKeyboardHold = calls.length;
        main.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
        await wait(550);
        assert(!popup.hidden, 'keyboard hold did not open the popup');
        assert(popup.shadowRoot.querySelector('.border-title').textContent === 'more-info', 'default more-info popup title is wrong');
        assert(popup.shadowRoot.querySelector('.entity-name').textContent === 'card name fallback', 'card name entity fallback is wrong');
        main.dispatchEvent(new KeyboardEvent('keyup', { key: ' ', bubbles: true }));
        assert(calls.length === beforeKeyboardHold, 'keyboard tap fired after a completed hold');
        popup.shadowRoot.querySelector('.logs-toggle').click();
        await wait(10);
        assert(
          popup.shadowRoot.querySelector('.log-status').textContent.includes('logbook unavailable'),
          'synchronous logbook error left the popup loading'
        );
        const retryToggle = popup.shadowRoot.querySelector('.logs-toggle');
        retryToggle.click();
        retryToggle.click();
        await wait(10);
        assert(retryCalls === 2, 'collapsing and reopening did not retry a failed Logbook request');
        assert(
          popup.shadowRoot.querySelector('.log-value').textContent === 'recovered',
          'retried Logbook request did not render its result'
        );

        popup.close();
        const oldConnection = {};
        const newConnection = {};
        let resolveOldRequest;
        let resolveNewRequest;
        const oldConnectionHass = {
          ...hass,
          connection: oldConnection,
          callWS: () => new Promise((resolve) => { resolveOldRequest = resolve; }),
        };
        const newConnectionHass = {
          ...hass,
          connection: newConnection,
          callWS: () => new Promise((resolve) => { resolveNewRequest = resolve; }),
        };
        popup.show(card, oldConnectionHass, { entity: 'light.popup', name: 'reconnect test' });
        popup.shadowRoot.querySelector('.logs-toggle').click();
        await wait(1);
        assert(typeof resolveOldRequest === 'function', 'old-connection Logbook request did not start');
        popup.updateHass(newConnectionHass);
        await wait(1);
        assert(typeof resolveNewRequest === 'function', 'new connection did not restart open Logbook');
        resolveNewRequest([{ when: 1700000900, state: 'fresh connection' }]);
        await wait(1);
        resolveOldRequest([{ when: 1700001000, state: 'stale connection' }]);
        await wait(1);
        assert(
          popup.shadowRoot.querySelector('.log-value').textContent === 'fresh connection',
          'old-connection Logbook result replaced the current request'
        );
        popup.close();

        popup.remove();
        assert(popup.hidden, 'removing the popup host did not close it');
        assert(popup._hass === null && popup._config === null && popup._trigger === null, 'popup host disconnect retained session references');
        assert(popup._body.children.length === 0 && popup._rangeControls.length === 0, 'popup host disconnect retained rendered controls');

        card.setConfig({ entity: 'light.popup', hold_action: { action: 'more-info' } });
        card.hass = hass;
        main.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true }));
        await wait(550);
        main.dispatchEvent(new KeyboardEvent('keyup', { key: ' ', bubbles: true }));
        const recreatedPopup = document.querySelector('terminal-entity-popup');
        assert(recreatedPopup && recreatedPopup !== popup, 'detached popup singleton was not recreated');
        assert(
          recreatedPopup.shadowRoot.querySelector('.border-title').textContent === 'more-info',
          'recreated popup did not use the default more-info title'
        );
        assert(
          recreatedPopup.shadowRoot.querySelector('.entity-name').textContent === 'Popup light',
          'entity friendly-name popup fallback is wrong'
        );

        card.remove();
        assert(recreatedPopup.hidden, 'disconnect did not close the card popup');
        assert(document.querySelectorAll('terminal-entity-popup').length === 1, 'duplicate popup hosts were created');

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal entity popup';
        document.querySelector('#result').textContent = [
          'PASS: pointer and keyboard holds open the custom terminal popup',
          'PASS: completed holds suppress tap and native more-info',
          'PASS: configurable more-info border title, entity name, state and capability-aware controls',
          'PASS: on-demand six-entry logbook tree is enclosed by its expanded wrapper',
          'PASS: focus survives refresh; Logbook retry/reconnect guards reject stale results',
          'PASS: services, Escape, focus restoration and disconnect cleanup',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal entity popup';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
