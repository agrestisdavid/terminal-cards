<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Terminal Cards preview</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --error-color: #f38ba8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 48px;
        background: #11111b;
        color: #cdd6f4;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }
      h1 { margin: 0 0 30px; color: #89b4fa; font-size: 20px; font-weight: 700; }
      h1 span { color: #6c7086; font-weight: 400; }
      main { display: grid; gap: 24px; }
      terminal-title-card, terminal-card-wrapper { max-width: 1000px; }
    </style>
    <script>
      customElements.define(
        'ha-markdown',
        class extends HTMLElement {
          set content(value) { this.textContent = String(value || '').replaceAll('**', ''); }
        }
      );
      customElements.define(
        'ha-icon',
        class extends HTMLElement {
          set icon(value) {
            this._icon = value;
            if (value?.includes('dots-horizontal')) this.textContent = '···';
            else if (value?.includes('dots')) this.textContent = '⋮';
            else if (value?.includes('menu') || value?.includes('tune')) this.textContent = '≡';
            else if (value?.includes('arrow') || value?.includes('chevron')) this.textContent = '→';
            else if (value?.includes('recycle')) this.textContent = '♻';
            else if (value?.includes('newspaper')) this.textContent = '▤';
            else if (value?.includes('leaf')) this.textContent = '♧';
            else if (value?.includes('trash') || value?.includes('delete')) this.textContent = '▣';
            else if (value?.includes('bottle') || value?.includes('glass')) this.textContent = '◇';
            else this.textContent = '◉';
            this.style.display = 'grid';
            this.style.placeItems = 'center';
            this.style.fontSize = value?.includes('dots') ? '22px' : '20px';
          }
          get icon() { return this._icon; }
        }
      );
      window.loadCardHelpers = async () => ({
        createCardElement(config) {
          const tag = config.type.startsWith('custom:') ? config.type.slice(7) : config.type;
          const card = document.createElement(tag);
          card.setConfig(config);
          return card;
        },
      });
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <h1>terminal-cards <span>// title + wrapper + light + switch + sensor + calendar + waste + waste-status + alarm + shutter + nav</span></h1>
    <main></main>
    <script type="module">
      const hass = {
        states: {
          'light.kitchen': {
            entity_id: 'light.kitchen', state: 'on',
            attributes: {
              friendly_name: 'kitchen', brightness: 204, color_mode: 'hs',
              rgb_color: [166, 227, 161], hs_color: [115, 72],
              color_temp_kelvin: 3600, min_color_temp_kelvin: 2000,
              max_color_temp_kelvin: 6500, supported_color_modes: ['hs', 'color_temp'],
            },
          },
          'light.dining': {
            entity_id: 'light.dining', state: 'off',
            attributes: { friendly_name: 'dining', brightness: 92, supported_color_modes: ['brightness'] },
          },
          'light.garage': {
            entity_id: 'light.garage', state: 'unavailable',
            attributes: { friendly_name: 'garage', supported_color_modes: ['onoff'] },
          },
          'cover.office': {
            entity_id: 'cover.office', state: 'open',
            attributes: {
              friendly_name: 'office blind', current_position: 68,
              current_tilt_position: 35, supported_features: 79,
            },
          },
          'input_boolean.guest_mode': {
            entity_id: 'input_boolean.guest_mode', state: 'off',
            attributes: { friendly_name: 'guest mode' },
          },
          'sensor.temperature': {
            entity_id: 'sensor.temperature', state: '22.5',
            attributes: { friendly_name: 'living temperature', unit_of_measurement: '°C' },
          },
          'calendar.family': {
            entity_id: 'calendar.family', state: 'off',
            attributes: { friendly_name: 'family calendar' },
          },
          'calendar.waste': {
            entity_id: 'calendar.waste', state: 'off',
            attributes: { friendly_name: 'waste collection' },
          },
          'alarm_control_panel.home': {
            entity_id: 'alarm_control_panel.home', state: 'armed_home',
            attributes: {
              friendly_name: 'home alarm', code_format: 'number',
              code_arm_required: true, supported_features: 7,
            },
          },
        },
        formatEntityState: (entity) => entity.state,
        callService() {},
        user: { name: 'preview' },
        connection: {
          subscribeMessage(callback, params) {
            if (params?.type === 'calendar/event/subscribe') {
              const future = (hours) => new Date(Date.now() + hours * 3600000).toISOString();
              const events = params.entity_id === 'calendar.waste'
                ? [
                  { summary: 'gelber sack', start: future(24) },
                  { summary: 'papier', start: future(96) },
                  { summary: 'biomüll', start: future(168) },
                  { summary: 'restmüll', start: future(240) },
                ]
                : [
                  { summary: 'team sync', start: future(18), end: future(19) },
                  { summary: 'dentist', start: future(42), end: future(43) },
                  { summary: 'family dinner', start: future(68), end: future(70) },
                ];
              setTimeout(() => callback({ events }), 0);
            } else {
              setTimeout(() => callback({
                result: '3 cameras online',
                listeners: { all: false, domains: [], entities: [], time: false },
              }), 0);
            }
            return Promise.resolve(() => undefined);
          },
        },
      };

      await customElements.whenDefined('terminal-card-wrapper');
      const title = document.createElement('terminal-title-card');
      title.setConfig({
        title: 'home status // terminal cards',
        subtitle: '**system:** {{ states("sensor.camera_count") }}',
        entity: 'alarm_control_panel.home',
        state_position: 'bottom-right',
        state_tap_action: { action: 'more-info' },
        popup_title: 'security',
        font_size: 28,
        accent_color: 'blue',
      });
      title.hass = hass;
      document.querySelector('main').append(title);

      const wrapper = document.createElement('terminal-card-wrapper');
      wrapper.setConfig({
        title: 'lighting',
        title_position: 'right',
        accent_color: 'purple',
        entity: 'light.kitchen',
        state_template: '{{ states(config.entity) }} // 80%',
        state_position: 'bottom-right',
        columns: 3,
        cards: [
          {
            type: 'custom:terminal-light-card', entity: 'light.kitchen',
            show_brightness: true, show_hue: true, show_color_temp: true,
            use_light_color: true, more_icon: 'mdi:tune-variant', controls_expanded: true,
            border_title: 'ground floor', off_icon: 'mdi:lightbulb-off-outline',
          },
          {
            type: 'custom:terminal-light-card', entity: 'light.dining',
            show_brightness: true, controls_expanded: true,
            border_title: 'dining', off_icon: 'mdi:lightbulb-off-outline',
          },
          { type: 'custom:terminal-light-card', entity: 'light.garage', show_brightness: true },
        ],
      });
      wrapper.hass = hass;
      document.querySelector('main').append(wrapper);

      const controls = document.createElement('terminal-card-wrapper');
      controls.setConfig({
        title: 'covers + entities + calendar + alarm + navigation',
        accent_color: 'cyan',
        entity: 'cover.office',
        state_position: 'top-right',
        columns: 2,
        cards: [
          {
            type: 'custom:terminal-shutter-card', entity: 'cover.office',
            accent_color: 'yellow', more_icon: 'mdi:menu',
            border_title: 'office', off_icon: 'mdi:blinds', controls_expanded: false,
          },
          {
            type: 'custom:terminal-switch-card', entity: 'input_boolean.guest_mode',
            icon: 'mdi:account-check', off_icon: 'mdi:account-off',
            border_title: 'presence', accent_color: 'green',
          },
          {
            type: 'custom:terminal-alarm-card', entity: 'alarm_control_panel.home',
            border_title: 'security',
            more_icon: 'mdi:shield-key-outline', controls_expanded: false,
          },
          {
            type: 'custom:terminal-sensor-card', entity: 'sensor.temperature',
            border_title: 'climate', accent_color: 'cyan',
          },
          {
            type: 'custom:terminal-calendar-card', entity: 'calendar.family',
            title: 'agenda', max_events: 3, days_to_show: 30,
            accent_color: 'purple',
          },
          {
            type: 'custom:terminal-navigation-card', name: 'kitchen',
            navigation_path: '/dashboard-test/kitchen', icon: 'mdi:fridge',
            variant: 'continuous', accent_color: 'cyan',
            more_icon: 'mdi:arrow-right-bold', entity: 'light.kitchen',
            off_icon: 'mdi:lightbulb-off-outline', border_title: 'shortcuts',
            icon_tap_action: { action: 'toggle' },
          },
          {
            type: 'custom:terminal-navigation-card', name: 'system',
            navigation_path: '/config/dashboard', icon: 'mdi:cog',
            variant: 'pane', title_position: 'right',
            state_template: '{{ states.sensor.camera_count.state }}',
            accent_color: 'green', more_icon: 'mdi:arrow-right-bold',
          },
        ],
      });
      controls.hass = hass;
      document.querySelector('main').append(controls);

      const wasteComparison = document.createElement('terminal-card-wrapper');
      wasteComparison.setConfig({
        title: 'waste card comparison',
        accent_color: 'yellow',
        columns: 2,
        cards: [
          {
            type: 'custom:terminal-waste-card', entity: 'calendar.waste',
            title: 'calendar list', max_entries: 4, days_to_show: 90,
            plastic_color: 'yellow', paper_color: 'blue',
            bio_color: 'green', residual_color: 'grey',
          },
          {
            type: 'custom:terminal-waste-status-card', entity: 'calendar.waste',
            title: 'status + list tiles', tiles_title: 'next collections',
            max_entries: 4, days_to_show: 90, controls_expanded: true,
            plastic_color: 'yellow', paper_color: 'blue',
            bio_color: 'green', residual_color: 'grey',
          },
        ],
      });
      wasteComparison.hass = hass;
      document.querySelector('main').append(wasteComparison);
    </script>
  </body>
</html>
