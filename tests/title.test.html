<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>terminal-title-card test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --green-color: #123456;
        --error-color: #f38ba8;
      }
      body { background: #11111b; color: #cdd6f4; padding: 24px; }
      terminal-title-card { display: block; width: 520px; }
    </style>
    <script>
      customElements.define('ha-markdown', class extends HTMLElement {
        set content(value) {
          this._content = value;
          this.textContent = value;
        }
        get content() { return this._content; }
      });
    </script>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <pre id="result">WAITING</pre>
    <script type="module">
      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function run() {
        await customElements.whenDefined('terminal-title-card');
        let templateCallback;
        let templateParams;
        let unsubscribeCount = 0;
        const hass = {
          user: { name: 'tester' },
          connection: {
            subscribeMessage(callback, params) {
              templateCallback = callback;
              templateParams = params;
              return Promise.resolve(() => { unsubscribeCount += 1; });
            },
          },
        };
        const card = document.createElement('terminal-title-card');
        card.setConfig({
          title: '<b>kitchen status</b>',
          subtitle: '**power:** {{ states("sensor.power") }}',
          font_size: 30,
          title_position: 'right',
          accent_color: 'green',
        });
        document.body.prepend(card);
        card.hass = hass;
        await Promise.resolve();
        assert(typeof templateCallback === 'function', 'subtitle template did not subscribe');
        assert(templateParams.type === 'render_template', 'subtitle uses the wrong template API');
        const firstTemplateCallback = templateCallback;
        templateCallback({ result: '**power:** 42 W' });
        await Promise.resolve();

        const frame = card.shadowRoot.querySelector('.frame');
        const title = card.shadowRoot.querySelector('.title');
        const frameStyle = getComputedStyle(frame);
        const titleStyle = getComputedStyle(title);
        const frameRect = frame.getBoundingClientRect();
        const titleRect = title.getBoundingClientRect();

        assert(frameStyle.borderRadius === '0px', 'title card corners are not square');
        assert(frameStyle.borderTopWidth === '1px', 'title card border is not 1px');
        assert(frameStyle.borderTopColor === 'rgb(18, 52, 86)', 'title card ignored the HA theme color override');
        document.documentElement.style.setProperty('--green-color', '#654321');
        assert(
          getComputedStyle(frame).borderTopColor === 'rgb(101, 67, 33)',
          'title card accent did not react to a HA theme color change'
        );
        assert(frameStyle.boxShadow === 'none', 'title card renders a glow');
        assert(titleStyle.fontSize === '30px', 'configurable title size is not applied');
        assert(title.dataset.titlePosition === 'right', 'title position is not applied');
        assert(titleStyle.right === '12px', 'right title is not aligned');
        assert(titleRect.top < frameRect.top && titleRect.bottom > frameRect.top, 'title does not cut the border');
        assert(
          (titleRect.top + titleRect.bottom) / 2 > frameRect.top,
          'title was not lowered into the compact border'
        );
        assert(title.textContent === '<b>kitchen status</b>', 'title was not rendered literally');
        assert(!title.querySelector('b'), 'title interpreted config as HTML');
        const subtitle = card.shadowRoot.querySelector('.subtitle');
        assert(subtitle.content === '**power:** 42 W', 'rendered subtitle was not passed to HA Markdown');
        assert(subtitle.textContent === '**power:** 42 W', 'subtitle template result is missing');
        assert(subtitle.hass === hass, 'Home Assistant context was not passed to HA Markdown');
        const subtitleRect = subtitle.getBoundingClientRect();
        assert(
          Math.abs((subtitleRect.top + subtitleRect.bottom) / 2 - (frameRect.top + frameRect.bottom) / 2) < 1,
          'subtitle is not vertically centered in the title frame'
        );
        assert(frame.children.length === 2, 'title card subtitle container is missing');
        assert(card.getGridOptions().columns === 12, 'title card is not full-width by default');
        assert(card.getCardSize() === 2, 'title card size does not reflect the large font');

        const leftCard = document.createElement('terminal-title-card');
        leftCard.setConfig({
          title: 'left title',
          subtitle: 'left subtitle',
          font_size: 30,
          title_position: 'left',
        });
        document.body.prepend(leftCard);
        leftCard.hass = hass;
        const leftFrame = leftCard.shadowRoot.querySelector('.frame');
        const leftTitle = leftCard.shadowRoot.querySelector('.title');
        const leftSubtitle = leftCard.shadowRoot.querySelector('.subtitle');
        const leftFrameRect = leftFrame.getBoundingClientRect();
        const leftTitleRect = leftTitle.getBoundingClientRect();
        const leftSubtitleRect = leftSubtitle.getBoundingClientRect();
        const leftTitleStyle = getComputedStyle(leftTitle);
        const leftSubtitleStyle = getComputedStyle(leftSubtitle);
        const titleTextLeft = leftTitleRect.left + parseFloat(leftTitleStyle.paddingLeft);
        const subtitleTextLeft = leftSubtitleRect.left + parseFloat(leftSubtitleStyle.paddingLeft);
        assert(
          Math.abs(titleTextLeft - subtitleTextLeft) < 1,
          'left subtitle does not share the title text inset'
        );
        const titleToSubtitleGap = leftSubtitleRect.top - leftTitleRect.bottom;
        const subtitleToBottomGap = leftFrameRect.bottom - leftSubtitleRect.bottom;
        assert(
          Math.abs(titleToSubtitleGap - subtitleToBottomGap) < 1,
          `left subtitle gaps differ: title=${titleToSubtitleGap}, bottom=${subtitleToBottomGap}`
        );
        assert(
          Math.abs((subtitleRect.top + subtitleRect.bottom) / 2 - (frameRect.top + frameRect.bottom) / 2) < 1,
          'right subtitle alignment changed while adjusting the left layout'
        );

        const form = card.constructor.getConfigForm();
        const fields = form.schema.flatMap((item) => item.schema || [item]);
        assert(fields.find((field) => field.name === 'title').selector.text, 'native title selector missing');
        assert(fields.find((field) => field.name === 'subtitle').selector.template, 'native Markdown/template subtitle selector missing');
        const sizeField = fields.find((field) => field.name === 'font_size');
        assert(sizeField.selector.number.min === 14 && sizeField.selector.number.max === 48, 'font-size selector bounds are wrong');
        const accentField = fields.find((field) => field.name === 'accent_color');
        assert(accentField.selector.ui_color?.default_color === 'accent', 'title accent does not use the HA theme color selector');
        assert(fields.some((field) => field.name === 'title_position'), 'title position selector missing');

        let invalidTitle = false;
        let invalidSize = false;
        let invalidAccent = false;
        let invalidSubtitle = false;
        try { document.createElement('terminal-title-card').setConfig({ font_size: 22 }); }
        catch (_error) { invalidTitle = true; }
        try { document.createElement('terminal-title-card').setConfig({ title: 'x', font_size: 80 }); }
        catch (_error) { invalidSize = true; }
        try {
          document.createElement('terminal-title-card').setConfig({
            title: 'x',
            accent_color: '#123456',
          });
        } catch (_error) { invalidAccent = true; }
        try {
          document.createElement('terminal-title-card').setConfig({ title: 'x', subtitle: 42 });
        } catch (_error) { invalidSubtitle = true; }
        assert(invalidTitle, 'missing title was accepted');
        assert(invalidSize, 'invalid font size was accepted');
        assert(invalidAccent, 'custom accent outside the HA theme palette was accepted');
        assert(invalidSubtitle, 'non-string subtitle was accepted');
        assert(
          window.customCards.some((entry) => entry.type === 'terminal-title-card'),
          'title card picker metadata missing'
        );

        const compact = document.createElement('terminal-title-card');
        compact.setConfig({ title: 'compact title' });
        document.body.prepend(compact);
        assert(compact.getBoundingClientRect().height < 72, 'title-only card is not more compact than before');

        const legacyAccent = document.createElement('terminal-title-card');
        legacyAccent.setConfig({ title: 'legacy accent', accent_color: [137, 180, 250] });
        assert(
          legacyAccent.style.getPropertyValue('--terminal-card-accent') === 'rgb(137 180 250)',
          'existing RGB-array accent configuration lost render compatibility'
        );

        card.setConfig({ title: 'plain markdown', subtitle: '_literal markdown_' });
        card.hass = hass;
        await Promise.resolve();
        assert(card.shadowRoot.querySelector('.subtitle').content === '_literal markdown_', 'plain Markdown subtitle is wrong');
        firstTemplateCallback({ result: '**stale template result**' });
        await Promise.resolve();
        assert(
          card.shadowRoot.querySelector('.subtitle').content === '_literal markdown_',
          'stale subtitle template result replaced the current config'
        );
        assert(unsubscribeCount === 1, 'template subscription was not cleaned up on config change');
        card.remove();
        leftCard.remove();
        compact.remove();
        legacyAccent.remove();

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal-title-card';
        document.querySelector('#result').textContent = [
          'PASS: compact square 1px frame, lowered border title and no glow',
          'PASS: position-aware subtitle inset and balanced left-title spacing',
          'PASS: reactive Markdown/template subtitle with subscription cleanup',
          'PASS: native HA theme-color editor, validation and legacy RGB rendering',
        ].join('\n');
      }

      run().catch((error) => {
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal-title-card';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
