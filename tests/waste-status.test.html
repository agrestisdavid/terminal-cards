<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>terminal-waste-status-card compatibility test running</title>
    <style>
      :root {
        --card-background-color: #181825;
        --primary-text-color: #cdd6f4;
        --secondary-text-color: #6c7086;
        --accent-color: #89b4fa;
        --yellow-color: #ffeb3b;
        --error-color: #f38ba8;
      }
      body { background: #11111b; color: #cdd6f4; padding: 24px; }
      terminal-waste-status-card { display: block; width: 240px; }
    </style>
    <script type="module" src="../dist/terminal-cards.js"></script>
  </head>
  <body>
    <main id="cards"></main>
    <pre id="result">WAITING</pre>
    <script type="module">
      let callback;
      let unsubscribeCount = 0;
      const originalDateNow = Date.now;
      const hass = {
        locale: { language: 'de-AT' },
        config: { time_zone: 'Europe/Vienna' },
        connection: {
          subscribeMessage(next, request) {
            callback = next;
            if (request.type !== 'calendar/event/subscribe') {
              throw new Error('legacy alias uses the wrong calendar API');
            }
            return Promise.resolve(() => { unsubscribeCount += 1; });
          },
        },
        states: {
          'calendar.nickelsdorf': {
            entity_id: 'calendar.nickelsdorf',
            state: 'off',
            attributes: { friendly_name: 'Waste Collection Schedule Nickelsdorf' },
          },
        },
      };

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      async function run() {
        Date.now = () => Date.parse('2026-08-28T10:00:00+02:00');
        await Promise.all([
          customElements.whenDefined('terminal-waste-card'),
          customElements.whenDefined('terminal-waste-status-card'),
        ]);

        const PrimaryCard = customElements.get('terminal-waste-card');
        const LegacyCard = customElements.get('terminal-waste-status-card');
        assert(PrimaryCard !== LegacyCard, 'legacy alias reused the same custom-element constructor');
        assert(LegacyCard.prototype instanceof PrimaryCard, 'legacy alias does not inherit the primary waste card');

        const card = document.createElement('terminal-waste-status-card');
        card.setConfig({
          entity: 'calendar.nickelsdorf',
          title: 'müllstatus',
          tiles_title: 'nächste abholungen',
          controls_expanded: true,
        });
        card.hass = hass;
        document.querySelector('#cards').append(card);
        await Promise.resolve();
        await Promise.resolve();
        assert(typeof callback === 'function', 'legacy alias did not subscribe to the waste calendar');

        callback({
          events: [
            { summary: 'Gelber Sack', start: { date: '2026-09-01' }, end: { date: '2026-09-02' } },
            { summary: 'Papier', start: { date: '2026-09-07' }, end: { date: '2026-09-08' } },
            { summary: 'Altpapier', start: { date: '2026-09-14' }, end: { date: '2026-09-15' } },
          ],
        });
        await Promise.resolve();

        assert(card.shadowRoot.querySelector('.border-title').textContent === 'müllstatus', 'legacy alias lost the configured title');
        assert(card.shadowRoot.querySelector('.main-name').textContent === 'gelber sack', 'legacy alias does not render the new status layout');
        assert(card.shadowRoot.querySelector('.main-icon').icon === 'mdi:recycle', 'legacy alias lost semantic waste icons');
        assert(!card.shadowRoot.querySelector('.tiles-frame').hidden, 'legacy alias lost expansion settings');
        assert(card.shadowRoot.querySelectorAll('.tile').length === 1, 'legacy alias did not deduplicate additional status tiles');
        assert(card.shadowRoot.querySelector('.tile-name').textContent === 'papier', 'legacy alias did not keep the earliest paper collection');

        const fields = LegacyCard.getConfigForm().schema.flatMap((item) => item.schema || [item]);
        assert(fields.some((field) => field.name === 'controls_expanded'), 'legacy alias did not inherit the current editor');
        assert(window.customCards.some((entry) => entry.type === 'terminal-waste-card'), 'primary waste card is missing from the picker');
        assert(!window.customCards.some((entry) => entry.type === 'terminal-waste-status-card'), 'legacy alias is still exposed in the picker');

        card.remove();
        await Promise.resolve();
        await Promise.resolve();
        assert(unsubscribeCount === 1, 'legacy alias did not clean up its subscription');
        Date.now = originalDateNow;

        document.body.dataset.testStatus = 'PASS';
        document.title = 'PASS terminal-waste-status-card compatibility';
        document.querySelector('#result').textContent = [
          'PASS: v0.15 waste-status configs retain the new status layout',
          'PASS: compatibility alias inherits editor and lifecycle behavior',
          'PASS: only terminal-waste-card appears in the card picker',
        ].join('\n');
      }

      run().catch((error) => {
        Date.now = originalDateNow;
        document.body.dataset.testStatus = 'FAIL';
        document.title = 'FAIL terminal-waste-status-card compatibility';
        document.querySelector('#result').textContent = `FAIL: ${error.stack || error}`;
        console.error(error);
      });
    </script>
  </body>
</html>
